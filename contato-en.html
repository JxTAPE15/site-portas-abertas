	<form class="contact-form needs-validation" novalidate>
		<div class="mb-3">
			<label for="validationCustom01" class="form-label">First name</label>
			<input type="text" class="form-control" id="validationCustom01" placeholder="Enter your first name..."
				required>
			<div class="valid-feedback">
				Perfect!
			</div>
			<div class="invalid-feedback">
				Enter your first name.
			</div>
		</div>
		<div class="mb-3">
			<label for="validationCustom02" class="form-label">Last name</label>
			<input type="text" class="form-control" id="validationCustom02" placeholder="Enter your last name..."
				required>
			<div class="valid-feedback">
				Perfect!
			</div>
			<div class="invalid-feedback">
				Enter your last name.
			</div>
		</div>
		<div class="mb-3">
			<label for="validationServer01" class="form-label">Email</label>
			<input type="email" class="form-control" id="validationServer01" required placeholder="name@example.com">
			<div class="valid-feedback">
				Perfect!
			</div>
			<div class="invalid-feedback">
				Enter a valid email address.
			</div>
		</div>
		<div class="mb-3">
			<label for="validationPhone" class="form-label">Phone</label>
			<input type="tel" class="form-control" id="validationPhone" required
				pattern="\([0-9]{2}\)\s[0-9]{5}-[0-9]{4}" placeholder="(00) 00000-0000">
			<div class="invalid-feedback">
				Enter a phone number in the format (00) 00000-0000.
			</div>
		</div>

		<div class="mb-3">
			<label for="avaliacao" class="form-label">Rating</label>
			<select class="form-control" id="avaliacao" name="avaliacao" required>
				<option value="" selected disabled>Select a rating...</option>
				<option> 1 </option>
				<option> 2 </option>
				<option> 3 </option>
				<option> 4 </option>
				<option> 5 </option>
			</select>
			<div class="invalid-feedback">
				Select a rating.
			</div>
		</div>

		<div class="form-floating mb-3">
			<textarea class="form-control" placeholder="Comment" id="floatingTextarea"
				style="height: 100px; resize: none;"></textarea>
			<label for="floatingTextarea">Leave your comment here...</label>
		</div>

		<div class="d-flex gap-2">
			<button class="btn btn-outline-secondary" type="submit">Submit</button>
			<button class="btn btn-outline-danger" type="reset">Clear</button>
		</div>
	</form>
	<script>
		const contactForm = document.querySelector('.needs-validation');

		contactForm.addEventListener('submit', function (event) {
			if (!contactForm.checkValidity()) {
				event.preventDefault();
				event.stopPropagation();
			}

			contactForm.classList.add('was-validated');
		});

		contactForm.addEventListener('reset', function () {
			contactForm.classList.remove('was-validated');
		});
	</script>
